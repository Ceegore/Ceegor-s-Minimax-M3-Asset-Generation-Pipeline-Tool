# .github/workflows/release-gate.yml
# ============================================================================
# H-069 (_5 audit): Release-Candidate gate.
#
# Runs on tag push or manual workflow_dispatch. Executes the FULL release
# pipeline: contract tests, portable build, installer test, archive
# integrity, manifest verification, SBOM, and size-limit enforcement.
# A release must ONLY be published from a green run of this workflow.
#
# The fast PR gate (ci.yml) remains the first line of defense; this
# workflow is the mandatory second gate before any artifact reaches
# GitHub Releases.
# ============================================================================

name: Release Gate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-gate:
    name: Full release verification
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Architecture lint
        run: npm run lint

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Contract tests
        run: npm run test:contract

      - name: Build portable release
        run: node scripts/zip-portable.js

      - name: Verify release (manifest, archives, provenance, size limits)
        run: node scripts/verify-release.js --require-archive

      - name: Installer smoke test
        run: npm run test:installer
        continue-on-error: true

      - name: Generate SBOM
        run: node scripts/generate-sbom.js

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist-out/
          retention-days: 30
