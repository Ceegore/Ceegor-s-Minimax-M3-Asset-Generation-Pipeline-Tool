# .github/workflows/release-gate.yml
# ============================================================================
# H-069 (_5 audit): Release-Candidate gate.
#
# Runs on tag push or manual workflow_dispatch. Executes the FULL release
# pipeline: contract tests, portable build, installer test, archive
# integrity, manifest verification, SBOM, and size-limit enforcement.
# A release must ONLY be published from a green run of this workflow.
#
# B-003 (hhhhu3 audit): the pipeline now performs the deliberate sequence
#   identity -> build (Authenticode via electron-builder when signing
#   secrets exist) -> SBOM -> Minisign manifest signing -> strict
#   verification
# and it FAILS with explicit missing-secret diagnostics instead of running
# a strict verifier that can never pass. Only tag-triggered runs publish.
#
# RQ-002 fix: signing material is NEVER written into the repository
#   worktree. The pinned Minisign public key goes to RUNNER_TEMP and the
#   scripts read it via MINISIGN_PUB_PATH. A second clean-tree + full-SHA
#   assertion runs immediately before the build, and the produced
#   provenance is checked against the triggering SHA afterwards — so a
#   signed run can no longer record commitDirty=true and fail its own
#   strict verifier.
#
# RQ-004 fix: every mandatory release gate is an explicit job and the
#   publication step depends on ALL of them: qualification (lint, unit,
#   coverage gate, contract, IPC coverage), E2E + smoke, flakiness
#   repetition, mutation testing, build/sign/verify, and clean-VM
#   acceptance (packaged boot + installer + upgrade on a fresh runner).
#
# RQ-008 fix: the coverage GATE (test:coverage:gate) runs right after
#   coverage collection, so sub-threshold coverage fails the release.
#
# The fast PR gate (ci.yml) remains the first line of defense; this
# workflow is the mandatory second gate before any artifact reaches
# GitHub Releases.
# ============================================================================

name: Release Gate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version this run targets (must equal package.json version)'
        required: true
        type: string

env:
  # Shared by every job: tag vs manual dispatch and the declared version.
  IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
  # M-001 (hhhhu3 audit): manual runs must declare the version they build.
  RELEASE_EXPECTED_VERSION: ${{ inputs.version }}

jobs:
  # ------------------------------------------------------------------
  # Gate 1 — static checks, unit tests, coverage GENERATION + GATE,
  # contract and IPC coverage.
  # ------------------------------------------------------------------
  qualification:
    name: Lint + unit + coverage gate + contract + IPC coverage
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Architecture lint
        run: npm run lint

      - name: Unit tests (with coverage collection)
        run: npm run test:coverage

      # RQ-008 fix: collection alone cannot enforce the coverage
      # requirement — the gate must run and fail on threshold violations.
      - name: Unit line-coverage GATE (fail below threshold)
        run: npm run test:coverage:gate -- --threshold=50

      - name: Contract tests (real API when key present, explicit skip banner otherwise)
        env:
          RUN_CONTRACT_TESTS: '1'
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          if (-not $env:MINIMAX_API_KEY) { $env:MMX_CONTRACT_OPTIONAL = '1' }
          npm run test:contract

      # The npm script carries its own gate threshold (97%) — a lower
      # appended value would be ignored by the arg parser, so the release
      # simply uses the script's built-in gate.
      - name: IPC coverage gate (fail below 97%)
        run: npm run test:ipc-coverage

      - name: Check bundled dependencies
        run: node scripts/check-bundled-deps.js

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-evidence
          path: coverage/
          if-no-files-found: ignore
          retention-days: 30

  # ------------------------------------------------------------------
  # Gate 2 — E2E (real renderer, fake mmx) + smoke.
  # ------------------------------------------------------------------
  e2e-and-smoke:
    name: E2E + smoke
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      MMX_SHOTS_DIR: ${{ github.workspace }}\mmx-shots
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: E2E (real renderer + fake mmx, full ported smoke surface)
        run: npm run test:e2e -- --surface-threshold=96

      - name: Smoke test
        run: npm run test:smoke

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-e2e-failure-screenshots
          path: ${{ github.workspace }}\mmx-shots
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------------------------
  # Gate 3 — RQ-004 fix + V104-H002: flakiness qualification over the
  # FULL release-suite inventory under VARIED conditions: one serial
  # unit run (order effects), 10 repetitions of unit + smoke + E2E, and
  # 50 high-risk credential/security suite runs with alternating
  # concurrency. ANY failed repetition fails the release.
  # ------------------------------------------------------------------
  flakiness:
    name: Flakiness qualification (serial + 10x suites + 50x high-risk)
    runs-on: windows-latest
    timeout-minutes: 420
    env:
      FLAKY_REPEATS: '10'
      FLAKY_HIGH_RISK_REPEATS: '50'
      # Contract-suite policy for the repeated contract entry in
      # flakiness-run.js — MUST mirror the qualification gate above:
      # enable the runner explicitly and accept the loud skip banner
      # when the repo secret is absent. Without these, run-contract.js
      # fails closed (0.1 s exit-1 on every repetition — measured
      # 10/10 failed reps on the v1.0.5 run). When the key IS present
      # the contract tests hit the real API and MMX_CONTRACT_OPTIONAL
      # is inert.
      RUN_CONTRACT_TESTS: '1'
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      MMX_CONTRACT_OPTIONAL: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Repeated full-suite runs
        run: npm run test:flaky

      - name: Upload flakiness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flakiness-evidence
          path: coverage/flakiness-report.json
          if-no-files-found: ignore
          retention-days: 30

  # ------------------------------------------------------------------
  # Gate 4 — RQ-004 fix: mutation testing of the release-critical
  # credential/security modules. Any surviving mutant fails the release.
  # ------------------------------------------------------------------
  mutation:
    name: Mutation testing (critical credential modules)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Directed mutation testing
        run: npm run test:mutation

      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-evidence
          path: coverage/mutation-report.json
          if-no-files-found: ignore
          retention-days: 30

  # ------------------------------------------------------------------
  # Gate 5 — identity, signing, build, SBOM, strict verification.
  # Runs only after the qualification and E2E gates are green.
  # ------------------------------------------------------------------
  build-sign-verify:
    name: Identity + build + sign + strict verify
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [qualification, e2e-and-smoke]
    env:
      # Authenticode: electron-builder signs every PE it emits when these are
      # present. The strict verifier re-checks every binary afterwards.
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Assert release identity
        run: npm run assert:identity

      # B-003 (hhhhu3 audit): install a PINNED Minisign build and fail with an
      # explicit diagnostic when it cannot be verified. Pinned zip from the
      # official 0.11 release; SHA-256 measured and locked here.
      - name: Install pinned Minisign
        shell: pwsh
        run: |
          $url = 'https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-win64.zip'
          $expected = 'B9C31C2C3034F81F0E5F5D92CBCC20E67A9671B6E5455661588638848DC58031'
          $zip = Join-Path $env:RUNNER_TEMP 'minisign-0.11-win64.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($actual -ne $expected) {
            throw "Pinned Minisign download failed the SHA-256 check: expected $expected, got $actual"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'minisign')
          $exe = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'minisign') -Recurse -Filter minisign.exe | Select-Object -First 1
          if (-not $exe) { throw 'Minisign archive did not contain minisign.exe' }
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName
          # V104-C002: ship the pinned verifier WITH the release so the
          # installer bootstrap can verify the manifest signature without
          # trusting a host-provided minisign (fail-closed chain).
          Add-Content -Path $env:GITHUB_ENV -Value "MINISIGN_TOOL_PATH=$($exe.FullName)"
          & $exe.FullName -v

      # B-003 (hhhhu3 audit): prepare the signing material and fail with
      # explicit missing-secret diagnostics. A tag release MUST be signed;
      # a manual dry run may proceed without secrets (it never publishes).
      # RQ-002 fix: the pinned public key is written under RUNNER_TEMP and
      # exposed as MINISIGN_PUB_PATH — NEVER into the repository worktree.
      - name: Prepare signing material
        shell: pwsh
        run: |
          $tag = ($env:IS_TAG_RELEASE -eq 'true')
          $problems = @()
          if (-not $env:WIN_CSC_LINK) { $problems += 'WIN_CSC_LINK (Authenticode certificate, base64 or path)' }
          if (-not $env:WIN_CSC_KEY_PASSWORD) { $problems += 'WIN_CSC_KEY_PASSWORD (Authenticode certificate password)' }
          if (-not $env:MINISIGN_KEY_B64) { $problems += 'MINISIGN_KEY_B64 (Minisign secret key file, base64)' }
          if (-not $env:MINISIGN_PUB_KEY) { $problems += 'MINISIGN_PUB_KEY (Minisign public key line)' }
          if ($problems.Count -gt 0) {
            $msg = "Missing release signing secret(s): " + ($problems -join '; ')
            if ($tag) { throw $msg + ". A tag release cannot be built without signing. Configure the secrets in the repository settings." }
            Write-Warning "$msg - continuing as an UNSIGNED manual dry run (no publication)."
          }
          if ($env:MINISIGN_KEY_B64) {
            $keyPath = Join-Path $env:RUNNER_TEMP 'minisign.key'
            [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:MINISIGN_KEY_B64))
            Add-Content -Path $env:GITHUB_ENV -Value "MINISIGN_KEY_PATH=$keyPath"
          }
          if ($env:MINISIGN_PUB_KEY) {
            # RQ-002 fix: signing material stays OUTSIDE the worktree. The
            # strict verifier and sign:release read this path via
            # MINISIGN_PUB_PATH; an untracked file in the repo would dirty
            # `git status --porcelain` and poison the build provenance.
            $pubPath = Join-Path $env:RUNNER_TEMP 'minisign.pub'
            Set-Content -Path $pubPath -Value $env:MINISIGN_PUB_KEY -Encoding ascii
            Add-Content -Path $env:GITHUB_ENV -Value "MINISIGN_PUB_PATH=$pubPath"
          }
          # RR2-M001 (recheck-2): an unsigned manual dry run must be able to
          # finish the WHOLE pipeline, not die at finalize:release. When the
          # pinned public key secret is absent we generate an EPHEMERAL
          # throwaway keypair with the pinned minisign tool and use it as the
          # dry-run trust anchor (also replacing any partial secret key so the
          # pair is always consistent). It never leaves the runner, is clearly
          # marked via MINIMAX_EPHEMERAL_DRYRUN_KEY=1, and can never be
          # published: publication staging demands the REAL MINISIGN_PUB_KEY
          # secret, and only tag runs upload artifacts.
          if (-not $tag -and -not $env:MINISIGN_PUB_KEY) {
            $exe = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'minisign') -Recurse -Filter minisign.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) { throw 'Cannot generate the ephemeral dry-run keypair: the pinned minisign tool was not installed.' }
            $ephKey = Join-Path $env:RUNNER_TEMP 'minisign.key'
            $ephPub = Join-Path $env:RUNNER_TEMP 'minisign.pub'
            & $exe.FullName -G -W -f -p $ephPub -s $ephKey
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $ephKey) -or -not (Test-Path $ephPub)) {
              throw 'Ephemeral dry-run keypair generation failed.'
            }
            Add-Content -Path $env:GITHUB_ENV -Value "MINISIGN_KEY_PATH=$ephKey"
            Add-Content -Path $env:GITHUB_ENV -Value "MINISIGN_PUB_PATH=$ephPub"
            Add-Content -Path $env:GITHUB_ENV -Value 'MINIMAX_EPHEMERAL_DRYRUN_KEY=1'
            Write-Warning 'RR2-M001: this unsigned manual dry run uses an EPHEMERAL throwaway Minisign keypair. It exercises the full sign/verify pipeline but can never be published.'
          }
          if ($tag) {
            Add-Content -Path $env:GITHUB_ENV -Value 'REQUIRE_CODE_SIGNING=1'
          }
        env:
          MINISIGN_KEY_B64: ${{ secrets.MINISIGN_KEY_B64 }}
          MINISIGN_PUB_KEY: ${{ secrets.MINISIGN_PUB_KEY }}

      # RQ-002 fix: SECOND clean-tree assertion immediately before the
      # build/provenance. The identity check above ran before the signing
      # material existed; if ANYTHING has touched the worktree since, the
      # build must stop instead of recording commitDirty=true provenance.
      # Also pins the build to the exact triggering SHA.
      - name: Re-assert clean tree and exact SHA before build (RQ-002)
        shell: pwsh
        run: |
          $dirty = git status --porcelain
          if ($dirty) {
            Write-Host $dirty
            throw 'Working tree became dirty after signing-material preparation (RQ-002). Signing material must never be written into the repository worktree.'
          }
          $head = git rev-parse HEAD
          if ($env:GITHUB_SHA -and ($head -ne $env:GITHUB_SHA)) {
            throw "HEAD ($head) does not match the triggering SHA ($env:GITHUB_SHA)."
          }
          Write-Host "Clean tree confirmed at $head"

      - name: Build portable release
        run: node scripts/zip-portable.js

      # RQ-002 fix: the provenance must identify the EXACT triggering
      # commit and record a clean tree — enforced here, not only by the
      # strict verifier's generic dirty check.
      - name: Assert provenance matches the triggering SHA (RQ-002)
        shell: pwsh
        run: |
          $prov = Get-ChildItem dist-out -Filter *.provenance.json | Select-Object -First 1
          if (-not $prov) { throw 'Build produced no provenance file.' }
          $p = Get-Content $prov.FullName -Raw | ConvertFrom-Json
          if ($p.commitDirty -ne $false) {
            throw "Provenance records a dirty or unknown build tree (commitDirty=$($p.commitDirty)). Rebuild from a clean worktree."
          }
          if ($env:GITHUB_SHA -and $p.commit -and -not ($env:GITHUB_SHA.StartsWith($p.commit))) {
            throw "Provenance commit ($($p.commit)) does not identify the triggering SHA ($env:GITHUB_SHA)."
          }
          Write-Host "Provenance verified: clean build at $($p.commit)"

      - name: Generate SBOM
        run: node scripts/generate-sbom.js

      # V104-C002: finalize the canonical release inventory AFTER SBOM and
      # signing material exist, so the signed outer manifest covers every
      # published artifact (archives, exe, installer, provenance, SBOM,
      # pinned minisign key + verifier). Fail-closed on missing inputs.
      - name: Finalize release inventory
        run: npm run finalize:release

      # RR2-H007 (recheck-2): electron-builder signs only the PEs IT emits.
      # The pinned minisign.exe verifier copied to the output ROOT by
      # finalize would ship unsigned and fail the expanded Authenticode
      # gate — sign every output-root PE here. Signing changes bytes, so
      # the outer manifest hashes are rewritten afterwards and only THEN
      # signed with Minisign (the signed manifest always covers the final
      # bytes).
      - name: Import Authenticode certificate for output-root signing
        if: env.REQUIRE_CODE_SIGNING == '1' || env.WIN_CSC_LINK != ''
        shell: pwsh
        run: |
          if (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD) {
            throw 'Output-root Authenticode signing requires WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD.'
          }
          if (Test-Path -LiteralPath $env:WIN_CSC_LINK) {
            $pfx = $env:WIN_CSC_LINK
          } else {
            $pfx = Join-Path $env:RUNNER_TEMP 'release-auth.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CSC_LINK))
          }
          $sec = ConvertTo-SecureString -String $env:WIN_CSC_KEY_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $sec
          Add-Content -Path $env:GITHUB_ENV -Value "MINIMAX_AUTH_THUMBPRINT=$($cert.Thumbprint)"

      - name: Authenticode-sign output-root binaries (RR2-H007)
        if: env.MINIMAX_AUTH_THUMBPRINT != ''
        run: node scripts/sign-output-binaries.js

      - name: Rewrite outer manifest after output-root signing (RR2-H007)
        if: env.MINIMAX_AUTH_THUMBPRINT != ''
        run: node scripts/verify-release.js --write-manifest

      # B-003 (hhhhu3 audit): sign the outer manifest BEFORE strict
      # verification — the verifier requires the .minisig to exist.
      - name: Sign release manifest (Minisign)
        if: env.MINISIGN_KEY_PATH != ''
        run: npm run sign:release

      - name: "Verify release (strict: archive, authenticode, manifest, provenance, SBOM)"
        if: env.IS_TAG_RELEASE == 'true'
        run: npm run verify:release

      - name: Verify release (lenient dry run for untagged manual builds)
        if: env.IS_TAG_RELEASE != 'true'
        run: node scripts/verify-release.js --require-archive --require-provenance --require-sbom --skip-integrity

      - name: Upload build output for clean-VM acceptance
        uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: dist-out/
          retention-days: 30

  # ------------------------------------------------------------------
  # Gate 6 — RQ-004 fix: clean-VM acceptance. GitHub-hosted runners are
  # freshly imaged VMs.
  #
  # V104-B001/V104-B002/V104-M001: this job exercises the EXACT build
  # output from Gate 5 — it boots the real packaged MiniMaxAssetTool.exe
  # from the downloaded win-unpacked tree and installs/upgrades/interrupts
  # the real release through the signed installer bootstrap. It does NOT
  # build a temp ASAR from the checkout, does not use the dev harness, and
  # needs no dev dependencies (Node built-ins only), so no `npm ci` runs.
  # ------------------------------------------------------------------
  clean-vm-acceptance:
    name: Clean-VM acceptance (node-free PowerShell harness)
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [build-sign-verify]
    steps:
      - uses: actions/checkout@v7

      # RR2-H001: NO actions/setup-node here. The acceptance harness is
      # pure PowerShell + the shipped CMD installer; installing a global
      # Node.js would invalidate the "standard machine" proof.
      - name: Download exact build output
        uses: actions/download-artifact@v7
        with:
          name: release-build
          path: dist-out/

      # RR2-H003: fetch the PREVIOUS published GitHub release (all seven
      # mandatory files) so the harness performs a REAL old->new upgrade.
      - name: Download previous release for real upgrade test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = '${{ github.repository }}'
          $api = "https://api.github.com/repos/$repo/releases?per_page=10"
          $rels = Invoke-RestMethod $api -Headers @{ 'User-Agent' = 'release-gate' }
          $tag = '${{ github.ref_name }}'
          $prev = $rels | Where-Object { $_.tag_name -ne $tag -and $_.assets } | Select-Object -First 1
          if (-not $prev) { Write-Host 'No previous release published yet - upgrade phase will be skipped.'; exit 0 }
          $dir = 'prev-release'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($a in $prev.assets) {
            Write-Host "Downloading $($a.name)..."
            Invoke-WebRequest $a.browser_download_url -OutFile (Join-Path $dir $a.name) -Headers @{ 'User-Agent' = 'release-gate' }
          }
          # Only wire the upgrade phase when the previous release is a
          # COMPLETE set (archives + manifest + minisig + key + verifier +
          # installer); otherwise the harness must skip, not fail.
          $files = Get-ChildItem $dir -File | ForEach-Object Name
          $need = @('minisign.pub', 'minisign.exe', 'Install-MiniMax-Asset-Tool.cmd')
          $ok = ($files | Where-Object { $_ -match '\.sha256$' }) -and ($files | Where-Object { $_ -match '\.minisig$' })
          foreach ($n in $need) { if ($files -notcontains $n) { $ok = $false } }
          if ($ok) { "PREV_RELEASE_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          else { Write-Host 'Previous release incomplete - upgrade phase will be skipped.' }

      # RR2-H001: node-free acceptance - fresh signed install, packaged
      # boot with a CDP:9222 probe, REAL offline function via the bundled
      # ffprobe, real old->new upgrade, deterministic interrupt and
      # tamper rejection.
      - name: Node-free clean-VM acceptance
        shell: pwsh
        env:
          MINIMAX_PREV_RELEASE_DIR: ${{ env.PREV_RELEASE_DIR }}
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\acceptance\clean-vm-acceptance.ps1 -DistDir dist-out

      - name: Upload clean-VM evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-vm-evidence
          path: coverage/clean-vm-acceptance.json
          retention-days: 30

  # ------------------------------------------------------------------
  # Publication — ONLY after every mandatory gate is green for the
  # exact tag SHA. Manual dispatch runs never reach this step's upload.
  # ------------------------------------------------------------------
  release-publication:
    name: Release artifact publication
    runs-on: windows-latest
    timeout-minutes: 20
    needs: [qualification, e2e-and-smoke, flakiness, mutation, build-sign-verify, clean-vm-acceptance]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download qualified build output
        uses: actions/download-artifact@v7
        with:
          name: release-build
          path: dist-out/

      # RR2-C002 (recheck-2): environment variables do NOT cross job
      # boundaries — this job must provision its OWN pinned Minisign
      # verifier and pinned public key. The pinned key is the trust
      # anchor the staged inventory signature is verified against;
      # the minisign.pub shipped inside the release is payload, never
      # anchor.
      - name: Install pinned Minisign (publication verifier)
        shell: pwsh
        run: |
          $url = 'https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-win64.zip'
          $expected = 'B9C31C2C3034F81F0E5F5D92CBCC20E67A9671B6E5455661588638848DC58031'
          $zip = Join-Path $env:RUNNER_TEMP 'minisign-0.11-win64.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($actual -ne $expected) {
            throw "Pinned Minisign download failed the SHA-256 check: expected $expected, got $actual"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'minisign')
          $exe = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'minisign') -Recurse -Filter minisign.exe | Select-Object -First 1
          if (-not $exe) { throw 'Minisign archive did not contain minisign.exe' }
          Add-Content -Path $env:GITHUB_ENV -Value "MINISIGN_TOOL_PATH=$($exe.FullName)"

      - name: Prepare pinned public key (publication trust anchor)
        shell: pwsh
        env:
          MINISIGN_PUB_KEY: ${{ secrets.MINISIGN_PUB_KEY }}
        run: |
          if (-not $env:MINISIGN_PUB_KEY) {
            if ($env:IS_TAG_RELEASE -eq 'true') {
              throw 'Tag release requires the MINISIGN_PUB_KEY secret to verify the signed inventory before publication (RR2-C002).'
            }
            Write-Warning 'RR2-M001: no MINISIGN_PUB_KEY secret - unsigned manual dry run, publication staging is skipped.'
            Add-Content -Path $env:GITHUB_ENV -Value 'PUBLICATION_STAGING_ENABLED=0'
            exit 0
          }
          # RQ-002: signing material stays OUTSIDE the worktree.
          $pubPath = Join-Path $env:RUNNER_TEMP 'minisign.pub'
          Set-Content -Path $pubPath -Value $env:MINISIGN_PUB_KEY -Encoding ascii
          Add-Content -Path $env:GITHUB_ENV -Value "MINISIGN_PUB_PATH=$pubPath"
          Add-Content -Path $env:GITHUB_ENV -Value 'PUBLICATION_STAGING_ENABLED=1'

      # V104-C002 + RR2-B002/M003/C002 (recheck-2): publication must
      # contain EXACTLY the signed inventory — never the whole dist-out
      # tree. stage-publication.js CRYPTOGRAPHICALLY verifies the manifest
      # signature against the pinned key, rejects extra/unsafe manifest
      # entries, and stages only the inventoried files (creating nested
      # parent dirs, fail-closed on any mismatch).
      # RR2-M001: an unsigned manual dry run has no .minisig and must not
      # fail here — it skips staging with a loud banner instead.
      - name: Stage publication from signed inventory
        if: env.PUBLICATION_STAGING_ENABLED == '1'
        run: npm run stage:publication

      - name: Unsigned dry run banner (RR2-M001)
        if: env.PUBLICATION_STAGING_ENABLED != '1'
        shell: pwsh
        run: >
          Write-Host '::warning::Unsigned manual dry run - publication staging
          skipped, no release artifacts are produced or uploaded.'

      # M-001 (hhhhu3 audit): only a tag-triggered run uploads publication
      # output. A manual dispatch run must never produce "release artifacts".
      - name: Upload release artifacts
        if: env.IS_TAG_RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist-out/publication/
          retention-days: 30
